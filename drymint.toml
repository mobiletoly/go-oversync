# Generated by `drymint repo init`.
# Index exclusions reviewed for repository source and retained evidence.

version = "v0"

[index]
# Keep indexing deterministic and low-noise for local dev.
ignore = [
  # Evidence and tooling state are not runtime source.
  ".artifacts/**",
  "**/.artifacts/**",
  ".codex/**",
  ".idea/**",
  "tmp/**",
  "**/.gradle/**",
  "**/.pytest_cache/**",
  "**/.venv/**",
  "**/__pycache__/**",
  "**/build/**",
  "**/dist/**",
  "**/node_modules/**",
  "**/target/**",
  "**/vendor/**",
  "**/venv/**",
  ".drymint/**",
  ".git/**",
  ".gradle/**",
  ".pytest_cache/**",
  ".venv/**",
  "__pycache__/**",
  "build/**",
  "dist/**",
  "node_modules/**",
  "target/**",
  "vendor/**",
  "venv/**",
]

[plugins.go]
enabled = true

[languages.go.domains]
rules = [
  # Reusable server framework.
  { domain = "tests", source_roles = ["test"], match = ["oversync/**/*_test.go"] },
  { domain = "main", match = ["oversync/**/*.go"] },

  # Reusable Go/SQLite client framework.
  { domain = "oversqlite_tests", source_roles = ["test"], match = ["oversqlite/**/*_test.go"] },
  { domain = "oversqlite", match = ["oversqlite/**/*.go"] },

  # Cross-library PostgreSQL/SQLite end-to-end suite.
  { domain = "oversqlite_e2e", source_roles = ["test"], match = ["oversqlite_e2e/**/*_test.go"] },

  # Shared support used by the public example and repository integration harnesses.
  { domain = "shared_example_integration_support", source_roles = ["example", "test"], match = ["internal/exampleauth/**/*.go", "internal/baselinereadiness/**/*.go"] },

  # Repository-owned net/http integration test server.
  { domain = "integration_nethttp_server_tests", source_roles = ["test"], match = ["integration/nethttp_server/**/*_test.go"] },
  { domain = "integration_nethttp_server", source_roles = ["test"], match = ["integration/nethttp_server/**/*.go"] },

  # Sample server for the SQLiteNow KMP sample application.
  { domain = "samplesync_server", source_roles = ["example"], match = ["examples/samplesync_server/**/*.go"] },

  # Repository-owned mobile-flow integration simulator.
  { domain = "integration_mobile_flow_tests", source_roles = ["test"], match = ["integration/mobile_flow/**/*_test.go"] },
  { domain = "integration_mobile_flow", source_roles = ["test"], match = ["integration/mobile_flow/**/*.go"] },

  # Repository-owned schema-evolution qualification authority.
  { domain = "integration_schema_evolution_tests", source_roles = ["test"], match = ["integration/schema_evolution/**/*_test.go"] },
  { domain = "integration_schema_evolution", source_roles = ["test"], match = ["integration/schema_evolution/**/*.go"] },

  # Repository-level informational CLI.
  { domain = "repo_cli", source_roles = ["example"], match = ["main.go"] },
]
