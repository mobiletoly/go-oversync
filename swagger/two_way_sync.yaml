openapi: 3.1.0
info:
  title: go-oversync Two-Way Sync API
  version: 1.0.0
  description: |
    Breaking-change Oversqlite v1 data plane. Discovery is the sole admitted wire
    contract. Compact row groups are expanded to logical rows before validation,
    hashing, conflict checks, and application. Bounded JSON bodies may use a
    single gzip content encoding only when it is smaller than identity at 2,048
    decoded bytes or above; all protocol limits describe decoded JSON bytes.
servers:
  - url: http://localhost:8080
paths:
  /syncx/health:
    get:
      summary: Readiness health check
      responses:
        '200': { $ref: '#/components/responses/StatusOK' }
        '503': { $ref: '#/components/responses/StatusUnavailable' }
  /syncx/status:
    get:
      summary: Service status snapshot
      responses:
        '200': { $ref: '#/components/responses/StatusOK' }
  /sync/generations/{generation_id}:
    get:
      summary: Discover the sole admitted Oversqlite wire contract
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/SourceIDHeader'
        - $ref: '#/components/parameters/GenerationIDPath'
      responses:
        '200':
          description: Exact v1 discovery contract; no features or implementation tuning fields.
          headers:
            Content-Encoding: { $ref: '#/components/headers/OptionalGzip' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscoveryResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Error' }
        '426': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/Error' }
  /sync/connect:
    post:
      summary: Resolve source lifecycle admission after discovery
      security: [{ BearerAuth: [] }]
      parameters: [ { $ref: '#/components/parameters/SourceIDHeader' }, { $ref: '#/components/parameters/SchemaGenerationIDHeader' }, { $ref: '#/components/parameters/SchemaGenerationFingerprintHeader' }, { $ref: '#/components/parameters/RequestContentEncoding' } ]
      requestBody: { $ref: '#/components/requestBodies/ConnectRequest' }
      responses:
        '200': { $ref: '#/components/responses/ConnectOK' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ScopeAccessDenied' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/UnsupportedEncoding' }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '426': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/Error' }
  /sync/push:
    post:
      summary: Atomically commit or exactly replay one bounded complete source bundle
      description: |
        Validation precedence is authentication; immutable source/generation headers;
        media type/encoding; encoded and decoded limits; strict envelope; compact
        rows and canonical request hash; transaction scope admission; then committed-history replay. The response
        is the entire authoritative effect and HTTP 200 means committed.
      security: [{ BearerAuth: [] }]
      parameters: [ { $ref: '#/components/parameters/SourceIDHeader' }, { $ref: '#/components/parameters/SchemaGenerationIDHeader' }, { $ref: '#/components/parameters/SchemaGenerationFingerprintHeader' }, { $ref: '#/components/parameters/RequestContentEncoding' } ]
      requestBody: { $ref: '#/components/requestBodies/PushRequest' }
      responses:
        '200': { $ref: '#/components/responses/PushOK' }
        '400': { $ref: '#/components/responses/PushBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ScopeAccessDenied' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedEncoding' }
        '422': { $ref: '#/components/responses/Error' }
        '426': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/Error' }
  /sync/pull:
    get:
      summary: Read compact authoritative bundles to a stable ceiling
      security: [{ BearerAuth: [] }]
      parameters: [ { $ref: '#/components/parameters/SourceIDHeader' }, { $ref: '#/components/parameters/SchemaGenerationIDHeader' }, { $ref: '#/components/parameters/SchemaGenerationFingerprintHeader' }, { $ref: '#/components/parameters/AfterBundleSeq' }, { $ref: '#/components/parameters/MaxBundles' }, { $ref: '#/components/parameters/TargetBundleSeq' } ]
      responses:
        '200': { $ref: '#/components/responses/PullOK' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '426': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /sync/watch:
    get:
      summary: Receive optional coalescible bundle-sequence wake-up hints
      description: SSE is identity encoded and event delivery is not authoritative.
      security: [{ BearerAuth: [] }]
      parameters: [ { $ref: '#/components/parameters/SourceIDHeader' }, { $ref: '#/components/parameters/SchemaGenerationIDHeader' }, { $ref: '#/components/parameters/SchemaGenerationFingerprintHeader' }, { $ref: '#/components/parameters/AfterBundleSeq' } ]
      responses:
        '200':
          description: 'Identity-encoded event stream; every bundle event is exactly event: bundle followed by data: {"bundle_seq":N} and a blank line.'
          content:
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '426': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/Error' }
  /sync/snapshot-sessions:
    post:
      summary: Create a bounded snapshot session
      security: [{ BearerAuth: [] }]
      parameters: [ { $ref: '#/components/parameters/SourceIDHeader' }, { $ref: '#/components/parameters/SchemaGenerationIDHeader' }, { $ref: '#/components/parameters/SchemaGenerationFingerprintHeader' }, { $ref: '#/components/parameters/RequestContentEncoding' } ]
      requestBody: { $ref: '#/components/requestBodies/SnapshotSessionCreateRequest' }
      responses:
        '200': { $ref: '#/components/responses/SnapshotSessionOK' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ScopeAccessDenied' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedEncoding' }
        '426': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /sync/snapshot-sessions/{snapshot_id}:
    get:
      summary: Retrieve one bounded compact snapshot chunk
      security: [{ BearerAuth: [] }]
      parameters: [ { $ref: '#/components/parameters/SourceIDHeader' }, { $ref: '#/components/parameters/SchemaGenerationIDHeader' }, { $ref: '#/components/parameters/SchemaGenerationFingerprintHeader' }, { $ref: '#/components/parameters/SnapshotIDPath' }, { $ref: '#/components/parameters/AfterRowOrdinal' }, { $ref: '#/components/parameters/MaxRows' }, { $ref: '#/components/parameters/MaxBytes' } ]
      responses:
        '200': { $ref: '#/components/responses/SnapshotChunkOK' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '426': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      summary: Release a snapshot session
      security: [{ BearerAuth: [] }]
      parameters: [ { $ref: '#/components/parameters/SourceIDHeader' }, { $ref: '#/components/parameters/SchemaGenerationIDHeader' }, { $ref: '#/components/parameters/SchemaGenerationFingerprintHeader' }, { $ref: '#/components/parameters/SnapshotIDPath' } ]
      responses:
        '204': { description: Snapshot session released }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '426': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
components:
  securitySchemes:
    BearerAuth: { type: http, scheme: bearer }
  parameters:
    SourceIDHeader: { name: Oversync-Source-ID, in: header, required: true, schema: { type: string, minLength: 1 } }
    SchemaGenerationIDHeader: { name: Oversync-Schema-Generation-ID, in: header, required: true, schema: { type: string, minLength: 1 } }
    SchemaGenerationFingerprintHeader: { name: Oversync-Schema-Generation-Fingerprint, in: header, required: true, schema: { type: string, pattern: '^[0-9a-f]{64}$' } }
    RequestContentEncoding: { name: Content-Encoding, in: header, required: false, schema: { type: string, enum: [identity, gzip] }, description: A single gzip member only; other or multiple encodings return unsupported_content_encoding. }
    GenerationIDPath: { name: generation_id, in: path, required: true, schema: { type: string, minLength: 1 } }
    SnapshotIDPath: { name: snapshot_id, in: path, required: true, schema: { type: string, minLength: 1 } }
    AfterBundleSeq: { name: after_bundle_seq, in: query, required: false, schema: { type: integer, format: int64, minimum: 0 } }
    MaxBundles: { name: max_bundles, in: query, required: false, schema: { type: integer, minimum: 1 } }
    TargetBundleSeq: { name: target_bundle_seq, in: query, required: false, schema: { type: integer, format: int64, minimum: 0 } }
    AfterRowOrdinal: { name: after_row_ordinal, in: query, required: false, schema: { type: integer, format: int64, minimum: 0 } }
    MaxRows: { name: max_rows, in: query, required: false, schema: { type: integer, minimum: 1 } }
    MaxBytes: { name: max_bytes, in: query, required: false, schema: { type: integer, format: int64, minimum: 1 } }
  headers:
    OptionalGzip: { schema: { type: string, enum: [gzip] }, description: Present only for a beneficial single-member gzip representation. }
  requestBodies:
    ConnectRequest:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/ConnectRequest' } } }
    PushRequest:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/PushRequest' } } }
    SnapshotSessionCreateRequest:
      required: false
      content: { application/json: { schema: { $ref: '#/components/schemas/SnapshotSessionCreateRequest' } } }
  responses:
    StatusOK: { description: Service status, content: { application/json: { schema: { $ref: '#/components/schemas/StatusResponse' } } } }
    StatusUnavailable: { description: Service unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/StatusResponse' } } } }
    Unauthorized: { description: Authentication required }
    Error: { description: Typed bounded error response, headers: { Content-Encoding: { $ref: '#/components/headers/OptionalGzip' } }, content: { application/json: { schema: { anyOf: [ { $ref: '#/components/schemas/ErrorResponse' }, { $ref: '#/components/schemas/SourceRetiredResponse' }, { $ref: '#/components/schemas/PushConflictResponse' } ] } } } }
    InvalidRequest: { description: Strict JSON/envelope or query error, headers: { Content-Encoding: { $ref: '#/components/headers/OptionalGzip' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    PushInvalid: { description: Push logical row/group/tuple/hash error after envelope acceptance, headers: { Content-Encoding: { $ref: '#/components/headers/OptionalGzip' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    PushBadRequest: { description: Strict envelope failures return invalid_request; accepted-envelope compact tuple, logical row, or canonical-hash failures return push_invalid, headers: { Content-Encoding: { $ref: '#/components/headers/OptionalGzip' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    UnsupportedEncoding: { description: Unsupported media type or content encoding, headers: { Content-Encoding: { $ref: '#/components/headers/OptionalGzip' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    BodyTooLarge: { description: Encoded or decoded body exceeds its bound, headers: { Content-Encoding: { $ref: '#/components/headers/OptionalGzip' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    ScopeAccessDenied: { description: Application transaction admission denied the scope (scope_access_denied), headers: { Content-Encoding: { $ref: '#/components/headers/OptionalGzip' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    ServiceUnavailable: { description: Service unavailable (including scope_admission_unavailable) or commit outcome unknown, headers: { Content-Encoding: { $ref: '#/components/headers/OptionalGzip' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    ConnectOK: { description: Lifecycle resolved, headers: { Content-Encoding: { $ref: '#/components/headers/OptionalGzip' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectResponse' } } } }
    PushOK:
      description: Complete committed or replayed authoritative effect.
      headers: { Content-Encoding: { $ref: '#/components/headers/OptionalGzip' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/PushResponse' } } }
    PullOK:
      description: Stable compact bundle page; an unrepresentable retained bundle is a terminal 500, never an empty has_more page.
      headers: { Content-Encoding: { $ref: '#/components/headers/OptionalGzip' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/PullResponse' } } }
    SnapshotSessionOK: { description: Snapshot session, headers: { Content-Encoding: { $ref: '#/components/headers/OptionalGzip' } }, content: { application/json: { schema: { $ref: '#/components/schemas/SnapshotSessionResponse' } } } }
    SnapshotChunkOK:
      description: Compact insert-only snapshot rows. required_decoded_body_bytes is returned only by snapshot_chunk_too_small.
      headers: { Content-Encoding: { $ref: '#/components/headers/OptionalGzip' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/SnapshotChunkResponse' } } }
  schemas:
    StatusResponse: { type: object, additionalProperties: true }
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          oneOf:
            - type: string
              enum: [authentication_failed, invalid_request, invalid_generation_discovery_request, missing_schema_generation, invalid_schema_generation_id, unknown_schema_generation, missing_schema_generation_fingerprint, malformed_schema_generation_fingerprint, schema_generation_fingerprint_mismatch, unsupported_schema_generation, retired_schema_generation, source_generation_unbound, source_generation_conflict, schema_generation_downgrade_forbidden, corrupt_source_generation_state, source_binding_limit_exceeded, session_generation_mismatch, corrupt_session_generation_state, corrupt_committed_push_state, generation_history_unavailable, generation_projection_integrity_error, bundle_limit_exceeded, bundle_projection_too_large, history_projection_capacity_exceeded, push_effect_coverage_incomplete, schema_generation_resolution_failed, generation_discovery_failed, source_retired, source_retired_invalid, invalid_gzip, unsupported_media_type, unsupported_content_encoding, encoded_body_too_large, decoded_body_too_large, push_invalid, push_conflict, push_replay_mismatch, source_sequence_out_of_order, source_sequence_changed, scope_uninitialized, scope_initializing, initialization_stale, history_pruned, initialization_expired, commit_outcome_unknown, service_not_ready, push_failed, connect_invalid, connect_failed, checkpoint_ahead, committed_bundle_unrepresentable, pull_failed, bundle_change_watch_forbidden, bundle_change_watch_disabled, bundle_change_watch_failed, snapshot_session_invalid, snapshot_build_capacity, snapshot_session_limit_exceeded, source_replacement_invalid, snapshot_session_create_failed, snapshot_chunk_invalid, snapshot_chunk_capacity, snapshot_chunk_too_small, snapshot_session_not_found, snapshot_session_expired, snapshot_session_forbidden, snapshot_chunk_failed, snapshot_session_delete_failed, projection_response_encoding_failed, response_encoding_failed, method_not_allowed, status_failed, health_failed]
            - type: string
              pattern: '^[a-z][a-z0-9_]{0,63}$'
              description: Deployment-declared application rejection category, valid only on HTTP 422.
        message: { type: string }
        required_decoded_body_bytes: { type: integer, format: int64, minimum: 1 }
        actual: { type: integer, format: int64, minimum: 0 }
        limit: { type: integer, format: int64, minimum: 1 }
        dimension: { type: string, enum: [row_count, logical_byte_count, row_decoded_body_bytes] }
        retryable: { type: boolean }
        remediation: { type: string }
        schema_generation_id: { type: string }
        source_id: { type: string, minLength: 1 }
        replaced_by_source_id: { type: string, minLength: 1, description: Omitted when no replacement exists; null and empty are invalid. }
        conflict: { $ref: '#/components/schemas/PushConflictDetails' }
      additionalProperties: true
    PushConflictDetails:
      type: object
      additionalProperties: false
      required: [schema, table, key, op, base_row_version, server_row_version, server_row_deleted, server_row]
      properties:
        schema: { type: string }
        table: { type: string }
        key: { type: object }
        op: { type: string, enum: [i, u, d] }
        base_row_version: { type: integer, format: int64, minimum: 0 }
        server_row_version: { type: integer, format: int64, minimum: 0 }
        server_row_deleted: { type: boolean }
        server_row: { description: Canonical full row after-image, or null when deleted or absent. }
    PushConflictResponse:
      type: object
      additionalProperties: false
      required: [error, message]
      properties:
        error: { type: string, enum: [push_conflict] }
        message: { type: string }
        conflict: { $ref: '#/components/schemas/PushConflictDetails' }
    SourceRetiredResponse:
      type: object
      additionalProperties: false
      required: [error, message, source_id]
      properties:
        error: { type: string, enum: [source_retired] }
        message: { type: string }
        source_id: { type: string, minLength: 1, description: Exact source identity from the failed request. }
        replaced_by_source_id: { type: string, minLength: 1, description: Omitted when no replacement exists; null and empty are invalid. }
    DiscoveryResponse:
      type: object
      additionalProperties: false
      required: [protocol_version, schema_generation, limits, watch_enabled]
      properties:
        protocol_version: { type: string, enum: [v1] }
        schema_generation: { $ref: '#/components/schemas/SchemaGeneration' }
        limits: { $ref: '#/components/schemas/WireLimits' }
        watch_enabled: { type: boolean }
    WireLimits:
      type: object
      additionalProperties: false
      required: [max_push_rows, max_push_decoded_bytes, max_pull_bundles, max_pull_decoded_bytes, max_snapshot_rows_per_chunk, max_snapshot_decoded_bytes_per_chunk, max_snapshot_rows, max_snapshot_logical_bytes, max_row_decoded_bytes]
      properties:
        max_push_rows: { type: integer, minimum: 1 }
        max_push_decoded_bytes: { type: integer, format: int64, minimum: 1 }
        max_pull_bundles: { type: integer, minimum: 1 }
        max_pull_decoded_bytes: { type: integer, format: int64, minimum: 1 }
        max_snapshot_rows_per_chunk: { type: integer, minimum: 1 }
        max_snapshot_decoded_bytes_per_chunk: { type: integer, format: int64, minimum: 1 }
        max_snapshot_rows: { type: integer, minimum: 1 }
        max_snapshot_logical_bytes: { type: integer, format: int64, minimum: 1 }
        max_row_decoded_bytes: { type: integer, format: int64, minimum: 1 }
    SchemaGeneration:
      type: object
      required: [id, fingerprint, tables]
      properties:
        id: { type: string, minLength: 1 }
        fingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
        tables: { type: array, items: { $ref: '#/components/schemas/GenerationTable' } }
    GenerationTable:
      type: object
      required: [schema, table, sync_key_columns, columns, foreign_keys]
      properties:
        schema: { type: string }
        table: { type: string }
        sync_key_columns: { type: array, minItems: 1, items: { type: string } }
        columns: { type: array, items: { $ref: '#/components/schemas/GenerationColumn' } }
        foreign_keys: { type: array, items: { type: object } }
    GenerationColumn:
      type: object
      required: [name, wire_type, nullable]
      properties:
        name: { type: string }
        wire_type: { type: string }
        nullable: { type: boolean }
    CanonicalInitializationToken:
      type: string
      format: uuid
      minLength: 36
      maxLength: 36
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      description: Canonical lowercase dashed UUID initialization token; clients and servers must not trim, normalize, or case-fold it.
    ConnectRequest:
      type: object
      additionalProperties: false
      required: [has_local_pending_rows]
      properties: { has_local_pending_rows: { type: boolean } }
    ConnectResponse:
      type: object
      additionalProperties: false
      required: [resolution]
      properties:
        resolution: { type: string, enum: [remote_authoritative, initialize_local, initialize_empty, retry_later] }
        initialization_id: { $ref: '#/components/schemas/CanonicalInitializationToken' }
        lease_expires_at: { type: string, format: date-time }
        retry_after_seconds: { type: integer, minimum: 1 }
    PushRequest:
      type: object
      additionalProperties: false
      required: [source_bundle_id, canonical_request_hash, rows]
      properties:
        source_bundle_id: { type: integer, format: int64, minimum: 1 }
        canonical_request_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        initialization_id: { $ref: '#/components/schemas/CanonicalInitializationToken' }
        rows: { $ref: '#/components/schemas/NonEmptyCompactRowGroups' }
    PushResponse:
      type: object
      additionalProperties: false
      required: [bundle_seq, bundle_hash, rows]
      properties:
        bundle_seq: { type: integer, format: int64, minimum: 1 }
        bundle_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        rows: { $ref: '#/components/schemas/NonEmptyCompactRowGroups' }
    PullResponse:
      type: object
      additionalProperties: false
      required: [stable_bundle_seq, bundles, has_more]
      properties:
        stable_bundle_seq: { type: integer, format: int64, minimum: 0 }
        bundles: { type: array, items: { $ref: '#/components/schemas/CompactBundle' } }
        has_more: { type: boolean }
    CompactBundle:
      type: object
      additionalProperties: false
      required: [bundle_seq, source_id, source_bundle_id, bundle_hash, rows]
      properties:
        bundle_seq: { type: integer, format: int64, minimum: 1 }
        source_id: { type: string }
        source_bundle_id: { type: integer, format: int64, minimum: 1 }
        bundle_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        rows: { $ref: '#/components/schemas/CompactRowGroups' }
    CompactRowGroups:
      type: array
      items: { $ref: '#/components/schemas/CompactRowGroup' }
      description: Ordered contiguous groups; each group begins at the enclosing requested or implied ordinal.
    NonEmptyCompactRowGroups:
      type: array
      minItems: 1
      items: { $ref: '#/components/schemas/CompactRowGroup' }
      description: A non-empty compact row-group sequence used by push requests and authoritative push responses.
    CompactRowGroup:
      type: array
      minItems: 3
      maxItems: 3
      x-oversqlite-array-shape: [table_index, first_row_ordinal, rows]
      prefixItems:
        - { type: integer, minimum: 0 }
        - { type: integer, format: int64, minimum: 0 }
        - type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CompactRowTuple' }
      items: false
      description: '[table_index, first_row_ordinal, rows] where table_index is the discovery table-array position.'
    CompactRowTuple:
      oneOf:
        - type: array
          minItems: 3
          maxItems: 3
