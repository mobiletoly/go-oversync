---
openapi: 3.1.0
info:
  title: Oversqlite v1 durable recovery — durable recovery contract
  version: 1.0.0
  description: Active sole-v1 wire contract for narrowed durable recovery. Runtime outcome and snapshot
    implementation is phased separately. Sole v1 with exact terminal upload outcomes, resolve-or-cancel,
    acknowledgment, and floor/hash-bound clean recovery snapshots. Snapshots cannot settle an outstanding
    upload. Existing row codecs and request/bundle hashes remain. No compatibility, per-column merge,
    decision/report API or prepaid storage quotas. Examples use independently computed shared golden vectors.
servers:
- url: http://localhost:8080
paths:
  /syncx/health:
    get:
      summary: Readiness health check
      responses:
        '200':
          $ref: '#/components/responses/StatusOK'
        '503':
          $ref: '#/components/responses/StatusUnavailable'
  /syncx/status:
    get:
      summary: Service status snapshot
      responses:
        '200':
          $ref: '#/components/responses/StatusOK'
  /sync/generations/{generation_id}:
    get:
      summary: Discover the sole admitted Oversqlite wire contract
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ProtocolVersionHeader'
      - $ref: '#/components/parameters/SourceIDHeader'
      - $ref: '#/components/parameters/GenerationIDPath'
      responses:
        '200':
          description: Exact sole-v1 discovery; no fallback or negotiation.
          headers:
            Content-Encoding:
              $ref: '#/components/headers/OptionalGzip'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Error'
        '426':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/Error'
  /sync/connect:
    post:
      summary: Resolve source lifecycle admission after discovery
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ProtocolVersionHeader'
      - $ref: '#/components/parameters/SourceIDHeader'
      - $ref: '#/components/parameters/SchemaGenerationIDHeader'
      - $ref: '#/components/parameters/SchemaGenerationFingerprintHeader'
      - $ref: '#/components/parameters/RequestContentEncoding'
      requestBody:
        $ref: '#/components/requestBodies/ConnectRequest'
      responses:
        '200':
          $ref: '#/components/responses/ConnectOK'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeAccessDenied'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/UnsupportedEncoding'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '426':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/Error'
      description: Attach a client source to the authorized scope. No outcome storage is prepaid on connect;
        retain existing source-count admission. A pending outcome cannot be destroyed by rebinding or
        replacement. Client-upload and trusted server-writer sources are disjoint within each scope;
        cross-owner admission returns409 source_generation_conflict before effects. Ownership fences
        survive acknowledgment, binding cleanup, history pruning and restart.
  /sync/push:
    post:
      summary: Commit or exactly replay one source operation and its retained terminal outcome
      description: Require exact v1/source/generation headers and strict complete request. Serialize with
        resolve/ack. Terminal committed/rejected/cancelled is HTTP200. Persist exact projected outcome
        and terminal source state atomically with committed business/history, or after rollback for typed
        rejection. No next source sequence before acknowledgment. Invalid/admission/infrastructure errors
        are nonterminal; old frozen requests require resolve-or-cancel before replacement.
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ProtocolVersionHeader'
      - $ref: '#/components/parameters/SourceIDHeader'
      - $ref: '#/components/parameters/SchemaGenerationIDHeader'
      - $ref: '#/components/parameters/SchemaGenerationFingerprintHeader'
      - $ref: '#/components/parameters/RequestContentEncoding'
      requestBody:
        $ref: '#/components/requestBodies/PushRequest'
      responses:
        '200':
          $ref: '#/components/responses/PushOK'
        '400':
          $ref: '#/components/responses/PushBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeAccessDenied'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedEncoding'
        '422':
          $ref: '#/components/responses/Error'
        '426':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/Error'
  /sync/pull:
    get:
      summary: Read compact authoritative bundles to a stable ceiling
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ProtocolVersionHeader'
      - $ref: '#/components/parameters/SourceIDHeader'
      - $ref: '#/components/parameters/SchemaGenerationIDHeader'
      - $ref: '#/components/parameters/SchemaGenerationFingerprintHeader'
      - $ref: '#/components/parameters/AfterBundleSeq'
      - $ref: '#/components/parameters/MaxBundles'
      - $ref: '#/components/parameters/TargetBundleSeq'
      responses:
        '200':
          $ref: '#/components/responses/PullOK'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '426':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /sync/watch:
    get:
      summary: Receive optional coalescible bundle-sequence wake-up hints
      description: SSE is identity encoded and event delivery is not authoritative.
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ProtocolVersionHeader'
      - $ref: '#/components/parameters/SourceIDHeader'
      - $ref: '#/components/parameters/SchemaGenerationIDHeader'
      - $ref: '#/components/parameters/SchemaGenerationFingerprintHeader'
      - $ref: '#/components/parameters/AfterBundleSeq'
      responses:
        '200':
          description: 'Identity-encoded event stream; every bundle event is exactly event: bundle followed
            by data: {"bundle_seq":N} and a blank line.'
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '426':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/Error'
  /sync/snapshot-sessions:
    post:
      summary: Create a bounded snapshot session
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ProtocolVersionHeader'
      - $ref: '#/components/parameters/SourceIDHeader'
      - $ref: '#/components/parameters/SchemaGenerationIDHeader'
      - $ref: '#/components/parameters/SchemaGenerationFingerprintHeader'
      - $ref: '#/components/parameters/RequestContentEncoding'
      requestBody:
        $ref: '#/components/requestBodies/SnapshotSessionCreateRequest'
      responses:
        '200':
          $ref: '#/components/responses/SnapshotSessionOK'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeAccessDenied'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedEncoding'
        '426':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      description: Recovery requires no unacknowledged source outcome, otherwise push_outcome_pending.
        The closed recovery object contains only minimum_bundle_seq. Source replacement and recovery are
        exclusive. Materialize T>=floor, echo the binding and streaming hash. The client requires clean
        local state; snapshots never settle an upload. No idempotent-create guarantee; TTL bounds orphan
        sessions.
  /sync/snapshot-sessions/{snapshot_id}:
    get:
      summary: Retrieve one bounded compact snapshot chunk
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ProtocolVersionHeader'
      - $ref: '#/components/parameters/SourceIDHeader'
      - $ref: '#/components/parameters/SchemaGenerationIDHeader'
      - $ref: '#/components/parameters/SchemaGenerationFingerprintHeader'
      - $ref: '#/components/parameters/SnapshotIDPath'
      - $ref: '#/components/parameters/AfterRowOrdinal'
      - $ref: '#/components/parameters/MaxRows'
      - $ref: '#/components/parameters/MaxBytes'
      responses:
        '200':
          $ref: '#/components/responses/SnapshotChunkOK'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '426':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      summary: Release a snapshot session
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ProtocolVersionHeader'
      - $ref: '#/components/parameters/SourceIDHeader'
      - $ref: '#/components/parameters/SchemaGenerationIDHeader'
      - $ref: '#/components/parameters/SchemaGenerationFingerprintHeader'
      - $ref: '#/components/parameters/SnapshotIDPath'
      responses:
        '204':
          description: Snapshot session released
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '426':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /sync/push-outcomes/resolve:
    post:
      operationId: resolvePushOutcome
      summary: Resolve exact upload or durably cancel it
      description: Serialized with push; returns retained exact outcome, or consumes the next sequence
        with cancelled. It never returns racy absence. Delayed push cannot commit after cancellation.
        Request encoded/decoded body limit4096 bytes.
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ProtocolVersionHeader'
      - $ref: '#/components/parameters/SourceIDHeader'
      - $ref: '#/components/parameters/SchemaGenerationIDHeader'
      - $ref: '#/components/parameters/SchemaGenerationFingerprintHeader'
      - $ref: '#/components/parameters/RequestContentEncoding'
      requestBody:
        $ref: '#/components/requestBodies/PushOutcomeResolveRequest'
      responses:
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeAccessDenied'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/UnsupportedEncoding'
        '426':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '200':
          $ref: '#/components/responses/PushOK'
  /sync/push-outcomes/ack:
    post:
      operationId: acknowledgePushOutcome
      summary: Acknowledge durable local disposition
      description: Only after atomic local disposition. Removes retained outcome payload while preserving
        durable sequence and latest-ack fences. Next operation requires this acknowledgment. Exact latest
        duplicate is idempotent; older sequence is HTTP 410. Encoded/decoded request body limit is 4096
        bytes.
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ProtocolVersionHeader'
      - $ref: '#/components/parameters/SourceIDHeader'
      - $ref: '#/components/parameters/SchemaGenerationIDHeader'
      - $ref: '#/components/parameters/SchemaGenerationFingerprintHeader'
      - $ref: '#/components/parameters/RequestContentEncoding'
      requestBody:
        $ref: '#/components/requestBodies/PushOutcomeAckRequest'
      responses:
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeAccessDenied'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/UnsupportedEncoding'
        '426':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '204':
          description: Acknowledgment durable, including exact latest duplicate.
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  parameters:
    SourceIDHeader:
      name: Oversync-Source-ID
      in: header
      required: true
      schema:
        type: string
        pattern: ^[!-~]{1,256}$
    SchemaGenerationIDHeader:
      name: Oversync-Schema-Generation-ID
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    SchemaGenerationFingerprintHeader:
      name: Oversync-Schema-Generation-Fingerprint
      in: header
      required: true
      schema:
        type: string
        pattern: ^[0-9a-f]{64}$
    RequestContentEncoding:
      name: Content-Encoding
      in: header
      required: false
      schema:
        type: string
        enum:
        - identity
        - gzip
      description: A single gzip member only; other or multiple encodings return unsupported_content_encoding.
    GenerationIDPath:
      name: generation_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    SnapshotIDPath:
      name: snapshot_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    AfterBundleSeq:
      name: after_bundle_seq
      in: query
      required: false
      schema:
        type: integer
        format: int64
        maximum: 9223372036854775807
        minimum: 0
    MaxBundles:
      name: max_bundles
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    TargetBundleSeq:
      name: target_bundle_seq
      in: query
      required: false
      schema:
        type: integer
        format: int64
        maximum: 9223372036854775807
        minimum: 0
    AfterRowOrdinal:
      name: after_row_ordinal
      in: query
      required: false
      schema:
        type: integer
        format: int64
        maximum: 9223372036854775807
        minimum: 0
    MaxRows:
      name: max_rows
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    MaxBytes:
      name: max_bytes
      in: query
      required: false
      schema:
        type: integer
        format: int64
        maximum: 9223372036854775807
        minimum: 1
    ProtocolVersionHeader:
      name: Oversync-Protocol-Version
      in: header
      required: true
      schema:
        type: string
        const: v1
      description: Missing, duplicate or non-v1 is HTTP426 before mutation. Exact literal; no negotiation.
  headers:
    OptionalGzip:
      schema:
        type: string
        enum:
        - gzip
      description: Present only for a beneficial single-member gzip representation.
  requestBodies:
    ConnectRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConnectRequest'
    PushRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PushRequest'
    SnapshotSessionCreateRequest:
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SnapshotSessionCreateRequest'
    PushOutcomeResolveRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PushOutcomeResolveRequest'
    PushOutcomeAckRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PushOutcomeAckRequest'
  responses:
    StatusOK:
      description: Service status
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StatusResponse'
    StatusUnavailable:
      description: Service unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StatusResponse'
    Unauthorized:
      description: Authentication required
    Error:
      description: Typed bounded error response
      headers:
        Content-Encoding:
          $ref: '#/components/headers/OptionalGzip'
      content:
        application/json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/ErrorResponse'
            - $ref: '#/components/schemas/SourceRetiredResponse'
    InvalidRequest:
      description: Strict JSON/envelope or query error
      headers:
        Content-Encoding:
          $ref: '#/components/headers/OptionalGzip'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PushInvalid:
      description: Push logical row/group/tuple/hash error after envelope acceptance
      headers:
        Content-Encoding:
          $ref: '#/components/headers/OptionalGzip'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PushBadRequest:
      description: Strict envelope failures return invalid_request; accepted-envelope compact tuple, logical
        row, or canonical-hash failures return push_invalid.
      headers:
        Content-Encoding:
          $ref: '#/components/headers/OptionalGzip'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedEncoding:
      description: Unsupported media type or content encoding
      headers:
        Content-Encoding:
          $ref: '#/components/headers/OptionalGzip'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BodyTooLarge:
      description: Encoded or decoded body exceeds its bound
      headers:
        Content-Encoding:
          $ref: '#/components/headers/OptionalGzip'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ScopeAccessDenied:
      description: Application transaction admission denied the scope (scope_access_denied)
      headers:
        Content-Encoding:
          $ref: '#/components/headers/OptionalGzip'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Service unavailable (including scope_admission_unavailable) or commit outcome unknown
      headers:
        Content-Encoding:
          $ref: '#/components/headers/OptionalGzip'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ConnectOK:
      description: Lifecycle resolved
      headers:
        Content-Encoding:
          $ref: '#/components/headers/OptionalGzip'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConnectResponse'
    PushOK:
      description: 'Durably committed terminal outcome: committed, rejected or cancelled. HTTP200 alone
        does not prove business commit.'
      headers:
        Content-Encoding:
          $ref: '#/components/headers/OptionalGzip'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PushResponse'
    PullOK:
      description: Stable compact bundle page; an unrepresentable retained bundle is a terminal 500, never
        an empty has_more page.
      headers:
        Content-Encoding:
          $ref: '#/components/headers/OptionalGzip'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PullResponse'
    SnapshotSessionOK:
      description: Snapshot session
      headers:
        Content-Encoding:
          $ref: '#/components/headers/OptionalGzip'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SnapshotSessionResponse'
    SnapshotChunkOK:
      description: Compact insert-only snapshot rows. required_decoded_body_bytes is returned only by
        snapshot_chunk_too_small.
      headers:
        Content-Encoding:
          $ref: '#/components/headers/OptionalGzip'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SnapshotChunkResponse'
  schemas:
    StatusResponse:
      type: object
      additionalProperties: true
    ErrorResponse:
      type: object
      required:
      - error
      - message
      properties:
        error:
          anyOf:
          - type: string
            enum:
            - authentication_failed
            - invalid_request
            - invalid_generation_discovery_request
            - missing_schema_generation
            - invalid_schema_generation_id
            - unknown_schema_generation
            - missing_schema_generation_fingerprint
            - malformed_schema_generation_fingerprint
            - schema_generation_fingerprint_mismatch
            - unsupported_schema_generation
            - retired_schema_generation
            - source_generation_unbound
            - source_generation_conflict
            - schema_generation_downgrade_forbidden
            - corrupt_source_generation_state
            - source_binding_limit_exceeded
            - session_generation_mismatch
            - corrupt_session_generation_state
            - corrupt_committed_push_state
            - generation_history_unavailable
            - generation_projection_integrity_error
            - bundle_limit_exceeded
            - bundle_projection_too_large
            - history_projection_capacity_exceeded
            - push_effect_coverage_incomplete
            - schema_generation_resolution_failed
            - generation_discovery_failed
            - source_retired
            - source_retired_invalid
            - invalid_gzip
            - unsupported_media_type
            - unsupported_content_encoding
            - encoded_body_too_large
            - decoded_body_too_large
            - push_invalid
            - source_sequence_out_of_order
            - source_sequence_changed
            - scope_uninitialized
            - scope_initializing
            - initialization_stale
            - history_pruned
            - initialization_expired
            - commit_outcome_unknown
            - service_not_ready
            - push_failed
            - connect_invalid
            - connect_failed
            - checkpoint_ahead
            - committed_bundle_unrepresentable
            - pull_failed
            - bundle_change_watch_forbidden
            - bundle_change_watch_disabled
            - bundle_change_watch_failed
            - snapshot_session_invalid
            - snapshot_build_capacity
            - snapshot_session_limit_exceeded
            - source_replacement_invalid
            - snapshot_session_create_failed
            - snapshot_chunk_invalid
            - snapshot_chunk_capacity
            - snapshot_chunk_too_small
            - snapshot_session_not_found
            - snapshot_session_expired
            - snapshot_session_forbidden
            - snapshot_chunk_failed
            - snapshot_session_delete_failed
            - projection_response_encoding_failed
            - response_encoding_failed
            - method_not_allowed
            - status_failed
            - health_failed
            - protocol_version_mismatch
            - push_outcome_mismatch
            - push_outcome_pending
            - push_outcome_acknowledged
            - push_outcome_too_large
            - recovery_floor_ahead
          - type: string
            pattern: ^[a-z][a-z0-9_]{0,63}$
            description: Nonterminal infrastructure/admission category. Validated application rejection
              is HTTP 200 inside PushOutcomeRejection.
        message:
          type: string
        required_decoded_body_bytes:
          type: integer
          format: int64
          maximum: 9223372036854775807
          minimum: 1
        actual:
          type: integer
          format: int64
          maximum: 9223372036854775807
          minimum: 0
        limit:
          type: integer
          format: int64
          maximum: 9223372036854775807
          minimum: 1
        dimension:
          type: string
          enum:
          - row_count
          - logical_byte_count
          - row_decoded_body_bytes
        retryable:
